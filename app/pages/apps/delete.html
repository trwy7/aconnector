{% extends "templates/base.html" %}
{% block title %}Delete app{% endblock %}
{% block mainclasses %}form{% endblock %}
{% block content %}
<h1>Delete {{app.name}}</h1>
<p>Are you sure you want to delete {{app.name}} ({{app.client_id}})?</p>
<form method="post">
    <input type="submit" id="submit" value="Yes" class="danger">
</form>
<a class="fakebutton" href="/app/{{app.client_id}}">No</a>
{% endblock %}
