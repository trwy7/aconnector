{% extends "templates/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Login/Sign up</h1>
<form method="post">
    <label for="email"><b>Email</b></label>
    <input type="email" placeholder="example@example.com" name="email" required>
    <button type="submit">Login</button>
</form>
{% endblock %}
